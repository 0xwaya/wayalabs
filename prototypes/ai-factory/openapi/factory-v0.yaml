openapi: 3.1.0
info:
  title: AI Factory Control + Webhooks
  version: 0.1.0
  description: |
    Phase 0 OpenAPI sketch for the production control plane.
    Not wired yet — Phase 1 implements verify+persist; booking comes in Phase 3.
    TypeScript source of truth: `src/lib/factory/types-live.ts`.
servers:
  - url: https://ai-factory-pink.vercel.app
    description: Production prototype
  - url: http://localhost:3000
    description: Local

tags:
  - name: runs
  - name: hooks
  - name: state

paths:
  /api/factory/state:
    get:
      tags: [state]
      summary: Server truth for the Factory floor
      operationId: getFactoryState
      responses:
        "200":
          description: Bays, crews, cash, lifetime, open runs (sandbox or live)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryState"

  /api/factory/runs:
    post:
      tags: [runs]
      summary: Launch a funnel as a durable Run
      operationId: createFactoryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Bay busy, locked role, or cash gate

  /api/factory/runs/{runId}:
    get:
      tags: [runs]
      summary: Run detail + step timeline
      operationId: getFactoryRun
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run with steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/factory/runs/{runId}/approve:
    post:
      tags: [runs]
      summary: Human gate for a consequential step tool
      operationId: approveFactoryRunStep
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRunRequest"
      responses:
        "200":
          description: Decision recorded; step may resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Step not waiting for approval

  /api/factory/runs/{runId}/cancel:
    post:
      tags: [runs]
      summary: Cancel an open run
      operationId: cancelFactoryRun
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryRun"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/hooks/{provider}:
    post:
      tags: [hooks]
      summary: Provider webhook ingress
      description: |
        Verify signature → ingress dedupe `(provider, event_id)` → resolve
        `commerce_key` → book at most one credit → optional reversal for refunds.
        Phase 1 persists only; Phase 3 books the ledger.
      operationId: ingestWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WebhookProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/webhook+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted (including duplicates / evidence-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookIngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Signature verification failed

  /api/hooks/stripe:
    post:
      tags: [hooks]
      summary: Stripe webhook (typed alias of /api/hooks/{provider})
      operationId: ingestStripeWebhook
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookIngestResponse"
        "401":
          description: Invalid Stripe-Signature

  /api/hooks/shopify:
    post:
      tags: [hooks]
      summary: Shopify webhook (typed alias)
      operationId: ingestShopifyWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookIngestResponse"
        "401":
          description: Invalid X-Shopify-Hmac-Sha256

components:
  parameters:
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Missing resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    FactoryMode:
      type: string
      enum: [sandbox, shadow, live]

    WebhookProvider:
      type: string
      enum: [stripe, shopify, shipstation, easypost, slack, resend, calendly]

    ProofKind:
      type: string
      enum:
        - payment_captured
        - order_paid
        - shipment_delivered
        - ticket_resolved
        - payment_refunded
        - dispute_opened
        - dispute_won
        - connector_health

    LedgerEntryKind:
      type: string
      enum: [credit, reversal, fee, opex]

    RunStatus:
      type: string
      enum:
        - pending
        - active
        - waiting_approval
        - waiting_proof
        - completed
        - failed
        - cancelled

    AgentRole:
      type: string
      enum:
        - inventory
        - sales
        - ops
        - marketing
        - support
        - logistics
        - quality
        - procurement

    CreateRunRequest:
      type: object
      required: [funnelId]
      properties:
        funnelId:
          type: string
          example: ms-nc-flash
        mode:
          $ref: "#/components/schemas/FactoryMode"

    CreateRunResponse:
      type: object
      required: [run]
      properties:
        run:
          $ref: "#/components/schemas/FactoryRun"

    ApproveRunRequest:
      type: object
      required: [stepId, decision]
      properties:
        stepId:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string

    FactoryRun:
      type: object
      required:
        - id
        - tenantId
        - bayId
        - funnelId
        - mode
        - status
        - stepIndex
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        tenantId: { type: string }
        bayId: { type: string }
        funnelId: { type: string }
        mode: { $ref: "#/components/schemas/FactoryMode" }
        status: { $ref: "#/components/schemas/RunStatus" }
        stepIndex: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FactoryRunDetail:
      allOf:
        - $ref: "#/components/schemas/FactoryRun"
        - type: object
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/StepJob"

    StepJob:
      type: object
      required: [runId, stepId, bayId, agentId, role, mode, toolsAllowed, input]
      properties:
        runId: { type: string }
        stepId: { type: string }
        bayId: { type: string }
        agentId: { type: string }
        role: { $ref: "#/components/schemas/AgentRole" }
        mode: { $ref: "#/components/schemas/FactoryMode" }
        toolsAllowed:
          type: array
          items: { type: string }
        input:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - queued
            - running
            - draft
            - waiting_approval
            - waiting_proof
            - succeeded
            - failed
            - cancelled

    ProofEvent:
      type: object
      required:
        - id
        - provider
        - eventId
        - kind
        - commerceKey
        - amountCents
        - currency
        - runId
        - bayId
        - receivedAt
        - rawRef
      properties:
        id: { type: string }
        provider: { $ref: "#/components/schemas/WebhookProvider" }
        eventId: { type: string }
        kind: { $ref: "#/components/schemas/ProofKind" }
        commerceKey: { type: ["string", "null"] }
        amountCents: { type: ["integer", "null"] }
        currency: { type: ["string", "null"] }
        runId: { type: ["string", "null"] }
        bayId: { type: ["string", "null"] }
        receivedAt: { type: string, format: date-time }
        rawRef: { type: ["string", "null"] }

    LedgerEntry:
      type: object
      required:
        - id
        - tenantId
        - bayId
        - runId
        - amountCents
        - currency
        - entryKind
        - commerceKey
        - refundId
        - sourceEventId
        - createdAt
      properties:
        id: { type: string }
        tenantId: { type: string }
        bayId: { type: ["string", "null"] }
        runId: { type: ["string", "null"] }
        amountCents: { type: integer }
        currency: { type: string, default: usd }
        entryKind: { $ref: "#/components/schemas/LedgerEntryKind" }
        commerceKey: { type: ["string", "null"] }
        refundId: { type: ["string", "null"] }
        sourceEventId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    HookIngestResponse:
      type: object
      required: [accepted, duplicate, evidenceOnly, proofEventId, ledgerEntryId]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        evidenceOnly: { type: boolean }
        proofEventId: { type: ["string", "null"] }
        ledgerEntryId: { type: ["string", "null"] }

    FactoryState:
      type: object
      description: Mirrors sandbox PublicState plus live mode fields (Phase 1+)
      additionalProperties: true
      properties:
        mode: { $ref: "#/components/schemas/FactoryMode" }
        cashCents: { type: integer }
        lifetimeRevenueCents: { type: integer }
        openRuns:
          type: array
          items:
            $ref: "#/components/schemas/FactoryRun"
        recentProofs:
          type: array
          items:
            $ref: "#/components/schemas/ProofEvent"
